# HISTORICAL EXAMPLE - NOT CURRENT DEPLOYMENT CONFIGURATION.
# This file describes the retired coordinator/XA experiment. Do not copy it for
# D3 controller admission or protocol-5 atomic storage, startup, or recovery.
# Use the reviewed private configuration and docs/distributed-storage.md instead.
# Current deployment pins capacity probes to loopback 941/942 and /status, uses
# one local physical MySQL instance (node 1:331, node 2:332), verified-identity TLS,
# equal writable applications, atomic transactions, and schema gate protocol 5.
# Never copy these historical ports, disabled-TLS settings or coordinator roles.
# Private /var/lib/starhub/account-config.properties additions. Never put live secrets here.
# Existing db.*, vault and account settings are also required.
server.id=1
public.origins=https://entrance-one.example,https://entrance-two.example
storage.enabled=false
storage.coordinator=false
storage.objectStore=/var/lib/starhub/transactions
storage.transactionNode=starhub-primary
storage.node2.db.url=jdbc:mysql://127.0.0.1:13306/starhub?serverTimezone=UTC&sslMode=DISABLED
storage.node2.db.user=REPLACE_PRIVATELY
storage.node2.db.password=REPLACE_PRIVATELY
storage.node1.probe.url=http://127.0.0.1:9411/status
storage.node2.probe.url=http://127.0.0.1:9412/status
storage.probe.token=REPLACE_PRIVATELY
storage.ingress.token=REPLACE_PRIVATELY
